<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>81 种 LUT · 照片测试</title>
<style>
:root{font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#172b26;background:#f1f2ed}*{box-sizing:border-box}body{margin:0}header{padding:36px max(22px,5vw) 24px;background:#e2e8df;border-bottom:1px solid #cbd5ca}h1{font-size:32px;letter-spacing:-1px;margin:4px 0 10px}p{margin:8px 0;color:#53645c}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase}main{max-width:1500px;margin:auto;padding:24px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;padding:14px;background:#f1f2edf2;z-index:2}select,input,button{font:inherit;border:1px solid #b6c3b7;border-radius:7px;padding:9px 12px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e4ebe2}button.primary{background:#254c3c;color:white}label{font-size:13px}.baseline{display:flex;gap:22px;align-items:center;margin:12px 0 25px;padding:18px;background:white;border-radius:12px}.baseline img{height:180px;width:240px;object-fit:contain;background:#e9ece7}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}article{background:white;border-radius:12px;overflow:hidden;border:1px solid #dde3d9}article>button{display:block;border:0;border-radius:0;padding:0;width:100%;background:#e7ebe5}article img{display:block;width:100%;height:300px;object-fit:contain}article .caption{padding:13px 16px}h2{font-size:15px;margin:0 0 8px}.badge{font-size:11px;padding:3px 7px;border-radius:4px;background:#e3ede5;color:#365c43}.warn{background:#f5e5c7;color:#755221}.metrics{font-size:12px;color:#697970;margin-top:8px}.links{font-size:12px;margin-top:10px}.links a{color:#2e6650;margin-right:14px}dialog{width:min(1320px,96vw);max-height:96vh;border:0;border-radius:13px;padding:18px;background:#f1f2ed;color:inherit}dialog::backdrop{background:#101b16ce}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare img{width:100%;height:72vh;object-fit:contain;background:#dde3da}.compare p{text-align:center;margin:4px}.close{float:right}footer{padding:28px 0;color:#6b776e;font-size:12px}@media(max-width:700px){h1{font-size:26px}main{padding:12px}nav{gap:8px}.baseline img{width:120px;height:140px}.compare img{height:57vh}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}article img{height:230px}.caption{padding:10px!important}}
</style>
<header><div class="eyebrow">Photo LUT Library / 2026.10.30</div><h1>81 种 LUT，真实照片对比</h1><p>6 张户外样片 × 50% / 100% 强度 · 972 张实际渲染 · 保留原件</p><p>统一 sRGB，未额外调整曝光、白平衡或饱和度。点击任一效果图，左右对照原图。</p></header>
<main><nav><label>样片 <select id="sample"></select></label><label>强度 <select id="strength"><option value="0.5">50%</option><option value="1">100%</option></select></label><input id="search" placeholder="搜索 LUT 名称" aria-label="搜索 LUT 名称"><label><input type="checkbox" id="attention"> 仅看剪裁提醒</label><span id="count"></span></nav><section class="baseline"><img id="baseline" alt="当前样片原图"><div><h2 id="sampleName"></h2><p id="sampleNote"></p><p>剪裁提醒：新增接近纯黑 &gt;1% 或新增接近纯白 &gt;0.5%。<br>这只是检查线索，黑白或强对比风格可能有意如此。</p><a id="originalLink">查看 sRGB 原图 PNG</a></div></section><div class="grid" id="grid"></div><footer>本轮只覆盖这些户外样片；尚不能证明人像肤色、室内和夜景适用性。浏览图为缩略 JPEG；每张可打开无损 PNG（最长边 1280px）。</footer></main>
<dialog id="modal"><button class="close" id="close">关闭 ✕</button><h2 id="modalTitle"></h2><div class="compare"><div><p>原图 / sRGB</p><img id="before" alt="原图"></div><div><p>当前 LUT 效果</p><img id="after" alt="LUT 效果"></div></div></dialog>
<script>
const D=__PHOTO_TEST_DATA__;
const $=id=>document.getElementById(id);
for(const s of D.samples){const o=document.createElement('option');o.value=s.id;o.textContent=s.name;$('sample').append(o)}
const pct=x=>(x*100).toFixed(2)+'%';
function show(item,r,s){$('modalTitle').textContent=item.name+' · '+s.name+' · '+r.strength*100+'%';$('before').src=s.baseline;$('after').src=r.path;$('modal').showModal()}
function draw(){const s=D.samples.find(s=>s.id===$('sample').value),strength=+$('strength').value,q=$('search').value.trim().toLowerCase();$('baseline').src=s.thumbnail;$('sampleName').textContent=s.name;$('sampleNote').textContent=s.note;$('originalLink').href=s.baseline;$('originalLink').target='_blank';$('grid').replaceChildren();let count=0;for(const item of D.items){const r=item.results.find(r=>r.sample_id===s.id&&r.strength===strength);if(!item.name.toLowerCase().includes(q)||($('attention').checked&&!r.metrics.attention))continue;count++;const a=document.createElement('article'),b=document.createElement('button'),im=document.createElement('img');im.src=r.thumbnail;im.loading='lazy';im.alt=item.name+'效果图';b.append(im);b.onclick=()=>show(item,r,s);a.append(b);const c=document.createElement('div');c.className='caption';const title=document.createElement('h2');title.textContent=item.name;c.append(title);const badge=document.createElement('span');badge.className='badge'+(r.metrics.attention?' warn':'');badge.textContent=r.metrics.attention?'留意暗部 / 高光剪裁':'已生成 · 待按喜好选择';c.append(badge);const m=document.createElement('div');m.className='metrics';m.textContent='新增近黑 '+pct(r.metrics.new_near_black_fraction)+' · 新增近白 '+pct(r.metrics.new_near_white_fraction);c.append(m);const l=document.createElement('div');l.className='links';const link=document.createElement('a');link.href=r.path;link.target='_blank';link.textContent='打开无损 PNG';l.append(link);c.append(l);a.append(c);$('grid').append(a)}$('count').textContent=count+' / 81 种'}
for(const id of ['sample','strength','attention'])$(id).onchange=draw;$('search').oninput=draw;$('close').onclick=()=>$('modal').close();$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').close()};draw();
</script></html>
